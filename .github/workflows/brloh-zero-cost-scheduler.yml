name: Brloh zero-cost scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brloh-zero-cost-scheduler
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger one idempotent Brloh batch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             --retry 3 --retry-delay 10 --max-time 150             -X POST             -H 'X-Brloh-Scheduler: render-free-v1'             https://max-agent-y89u.onrender.com/brloh/scheduled
